version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: roast-backend
    ports:
      - "8000:8000"
    environment:
      - AI_PROVIDER=gemini
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://localhost
    volumes:
      - ./backend/app:/app/app
      - ./prompts:/app/prompts
    restart: unless-stopped
    networks:
      - roast-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roast-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - roast-network

networks:
  roast-network:
    driver: bridge
